<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Pixel-Schachbrett Muster -->
    <pattern id="pixel-checkerboard" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8BAC0F" />
      <rect width="4" height="4" fill="#9BBC0F" />
      <rect x="4" y="4" width="4" height="4" fill="#9BBC0F" />
    </pattern>

    <!-- Kreisförmige Maske -->
    <mask id="circle-mask">
      <circle cx="50" cy="50" r="46" fill="#FFFFFF" />
    </mask>
  </defs>

  <!-- 1. Hintergrund: Schachbrett-Kreis -->
  <circle cx="50" cy="50" r="46" fill="url(#pixel-checkerboard)" stroke="#202020" stroke-width="3" />

  <g mask="url(#circle-mask)">
    <!-- 2. NES Konsole (zentriert im Hintergrund) -->
    <g id="nes-console" transform="translate(13, 10) scale(0.74)">
      <rect x="10" y="25" width="80" height="50" rx="2" fill="#D8D8D8" stroke="#202020" stroke-width="3" />
      <rect x="10" y="50" width="80" height="25" fill="#666666" />
      <line x1="10" y1="50" x2="90" y2="50" stroke="#202020" stroke-width="2" />
      <rect x="16" y="55" width="42" height="15" rx="1" fill="#202020" />
      <rect x="22" y="60" width="10" height="5" rx="1" fill="#666666" />
      <rect x="38" y="60" width="10" height="5" rx="1" fill="#666666" />
      <rect x="65" y="58" width="8" height="8" rx="1" fill="#D8D8D8" stroke="#202020" stroke-width="1.5" />
      <rect x="76" y="58" width="8" height="8" rx="1" fill="#D8D8D8" stroke="#202020" stroke-width="1.5" />
      <circle cx="61" cy="62" r="1.5" fill="#E60012" />
      <line x1="20" y1="28" x2="20" y2="50" stroke="#202020" stroke-width="2" />
      <line x1="25" y1="28" x2="25" y2="50" stroke="#202020" stroke-width="2" />
      <line x1="30" y1="28" x2="30" y2="50" stroke="#202020" stroke-width="2" />
    </g>

    <!-- 3. Neuer GameBoy (ausgetauscht, verkleinert & weiter unten rechts positioniert) -->
    <g id="gameboy-new" transform="translate(32, 28) scale(0.55)">
      <!-- Gehäuse -->
      <rect x="22" y="8" width="56" height="84" rx="6" fill="#D8D8D8" stroke="#202020" stroke-width="3"/>
      <!-- Display-Rahmen -->
      <rect x="28" y="16" width="44" height="32" rx="3" fill="#555555" />
      <!-- Grüner Pixel-Bildschirm -->
      <rect x="35" y="21" width="30" height="22" rx="1" fill="#8BAC0F" />
      <!-- Power LED -->
      <circle cx="31" cy="32" r="1.5" fill="#E60012" />
      <!-- Steuerkreuz (D-Pad) -->
      <path d="M 36 57 h -4 v 4 h -4 v 4 h 4 v 4 h 4 v -4 h 4 v -4 h -4 z" fill="#202020" />
      <!-- A/B Buttons -->
      <circle cx="68" cy="62" r="4" fill="#8A1B4A" />
      <circle cx="58" cy="67" r="4" fill="#8A1B4A" />
      <!-- Select / Start -->
      <rect x="40" y="79" width="7" height="2.5" rx="1" transform="rotate(-25 40 79)" fill="#666666" />
      <rect x="50" y="79" width="7" height="2.5" rx="1" transform="rotate(-25 50 79)" fill="#666666" />
      <!-- Lautsprecher-Schlitze -->
      <line x1="62" y1="84" x2="68" y2="78" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" />
      <line x1="66" y1="86" x2="72" y2="80" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Außenkontur -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#202020" stroke-width="3" />
</svg>
