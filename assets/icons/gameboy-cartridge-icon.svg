<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hauptgehäuse (Hellgrau) -->
  <path d="M 20 12 h 60 a 4 4 0 0 1 4 4 v 72 a 2 2 0 0 1 -2 2 h -64 a 2 2 0 0 1 -2 -2 v -72 a 4 4 0 0 1 4 -4 z" fill="#D8D8D8" stroke="#202020" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Rechteckige Kerbe oben links (Abschrägung/Notch) -->
  <rect x="16" y="12" width="10" height="12" fill="#D8D8D8" stroke="#202020" stroke-width="3" />
  <line x1="16" y1="24" x2="26" y2="24" stroke="#202020" stroke-width="3" />
  
  <!-- Abgerundete Vertiefung oben ("Nintendo GAME BOY"-Mulde) -->
  <rect x="26" y="18" width="48" height="14" rx="7" fill="#C4C4C4" stroke="#202020" stroke-width="2" />
  
  <!-- Seitliche Rillen oben -->
  <line x1="18" y1="18" x2="22" y2="18" stroke="#202020" stroke-width="2" />
  <line x1="18" y1="22" x2="22" y2="22" stroke="#202020" stroke-width="2" />
  <line x1="78" y1="18" x2="82" y2="18" stroke="#202020" stroke-width="2" />
  <line x1="78" y1="22" x2="82" y2="22" stroke="#202020" stroke-width="2" />

  <!-- Label-Vertiefung (Leere Fläche) -->
  <rect x="26" y="38" width="48" height="46" rx="2" fill="#E8E8E8" stroke="#202020" stroke-width="2" />
  
  <!-- Eingestanzt/Relief-Pfeil unten -->
  <polygon points="50,89 44,85 56,85" fill="#666666" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" />
</svg>
