<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- GameBoy (schaut oben aus der Papiertüte heraus) -->
  <g id="gameboy">
    <!-- GameBoy-Gehäuse -->
    <rect x="26" y="14" width="48" height="50" rx="5" fill="#D8D8D8" stroke="#202020" stroke-width="2.5" />
    
    <!-- Display-Rahmen -->
    <rect x="32" y="20" width="36" height="26" rx="2" fill="#555555" stroke="#202020" stroke-width="1.5" />
    
    <!-- Grüner GameBoy-Bildschirm -->
    <rect x="38" y="24" width="24" height="18" rx="1" fill="#8BAC0F" />
    
    <!-- Power LED -->
    <circle cx="35" cy="33" r="1.2" fill="#E60012" />
    
    <!-- Steuerkreuz (D-Pad) -->
    <path d="M 40 50 h -3 v 3 h -3 v 3 h 3 v 3 h 3 v -3 h 3 v -3 h -3 z" fill="#202020" />
    
    <!-- A/B Buttons -->
    <circle cx="65" cy="53" r="3" fill="#8A1B4A" stroke="#202020" stroke-width="1" />
    <circle cx="57" cy="57" r="3" fill="#8A1B4A" stroke="#202020" stroke-width="1" />
  </g>

  <!-- Papiertüte (im Stil des Logos, verdeckt den unteren Teil des GameBoys) -->
  <g id="shopping-bag">
    <!-- Hauptkörper der Papiertüte -->
    <path d="M 22 46 L 27 92 H 73 L 78 46 Z" fill="#D8D8D8" stroke="#202020" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Papier-Umschlag/Falte oben -->
    <path d="M 22 46 L 25 54 H 75 L 78 46 Z" fill="#C4C4C4" stroke="#202020" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Charakteristischer Papierbeutel-Griff (ausgestanzte Trageschlaufe) -->
    <rect x="40" y="58" width="20" height="8" rx="4" fill="#202020" />
    
    <!-- Roter NES-Akzentstreifen auf der Tüte -->
    <rect x="27" y="74" width="46" height="6" fill="#E60012" />
  </g>
</svg>
