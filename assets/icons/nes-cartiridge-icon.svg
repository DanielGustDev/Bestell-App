  <line x1="24" y1="8" x2="24" y2="92" stroke="#202020" stroke-width="2" />
  <line x1="29" y1="8" x2="29" y2="92" stroke="#202020" stroke-width="2" />
  <line x1="34" y1="8" x2="34" y2="92" stroke="#202020" stroke-width="2" />
  <line x1="39" y1="8" x2="39" y2="92" stroke="#202020" stroke-width="2" />

  <!-- Große abgesenkte Mulde für das Label -->
  <rect x="46" y="14" width="32" height="70" fill="#202020" />
  
  <!-- Blanc Label (Hellgrauer Aufkleber ohne Text/Bild) -->
  <rect x="48" y="16" width="28" height="66" fill="#D8D8D8" />
  
  <!-- Eingestanztes Pfeil-Dreieck unten (Kassetten-Grip) -->
