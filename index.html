<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Order</title>

    <link rel="shortcut icon" href="./assets/icons/main-logo.svg" type="image/x-icon">

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standards.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="style.css">

    <script src="./scripts/database.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>

</head>

<body onload="init()">
    <header>
        <div class="header-content">
            <div class="logo-container">
                <svg class="header-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
                    aria-hidden="true">
                    <g id="gameboy">
                        <rect class="gb-body" x="26" y="14" width="48" height="50" rx="5" fill="#D8D8D8"
                            stroke="#202020" stroke-width="2.5" />
                        <rect x="32" y="20" width="36" height="26" rx="2" fill="#555555" stroke="#202020"
                            stroke-width="1.5" />
                        <rect class="gb-screen" x="38" y="24" width="24" height="18" rx="1" fill="#8BAC0F" />
                        <circle cx="35" cy="33" r="1.2" fill="#E60012" />
                        <path d="M 40 50 h -3 v 3 h -3 v 3 h 3 v 3 h 3 v -3 h 3 v -3 h -3 z" fill="#202020" />
                        <circle cx="65" cy="53" r="3" fill="#8A1B4A" stroke="#202020" stroke-width="1" />
                        <circle cx="57" cy="57" r="3" fill="#8A1B4A" stroke="#202020" stroke-width="1" />
                    </g>
                    <g id="shopping-bag">
                        <path class="bag-body" d="M 22 46 L 27 92 H 73 L 78 46 Z" fill="#D8D8D8" stroke="#202020"
                            stroke-width="3" stroke-linejoin="round" />
                        <path d="M 22 46 L 25 54 H 75 L 78 46 Z" fill="#C4C4C4" stroke="#202020" stroke-width="3"
                            stroke-linejoin="round" />
                        <rect x="40" y="58" width="20" height="8" rx="4" fill="#202020" />
                        <rect class="nes-stripe" x="27" y="74" width="46" height="6" fill="#E60012" />
                    </g>
                </svg>
                <p class="logo-text">Game<br>Order</p>
            </div>
            <nav><svg width="45" height="35" viewBox="0 0 45 35" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M2.5 5C1.79167 5 1.19792 4.76042 0.71875 4.28125C0.239583 3.80208 0 3.20833 0 2.5C0 1.79167 0.239583 1.19792 0.71875 0.71875C1.19792 0.239583 1.79167 0 2.5 0H42.5C43.2083 0 43.8021 0.239583 44.2812 0.71875C44.7604 1.19792 45 1.79167 45 2.5C45 3.20833 44.7604 3.80208 44.2812 4.28125C43.8021 4.76042 43.2083 5 42.5 5H2.5ZM2.5 35C1.79167 35 1.19792 34.7604 0.71875 34.2812C0.239583 33.8021 0 33.2083 0 32.5C0 31.7917 0.239583 31.1979 0.71875 30.7188C1.19792 30.2396 1.79167 30 2.5 30H42.5C43.2083 30 43.8021 30.2396 44.2812 30.7188C44.7604 31.1979 45 31.7917 45 32.5C45 33.2083 44.7604 33.8021 44.2812 34.2812C43.8021 34.7604 43.2083 35 42.5 35H2.5ZM2.5 20C1.79167 20 1.19792 19.7604 0.71875 19.2812C0.239583 18.8021 0 18.2083 0 17.5C0 16.7917 0.239583 16.1979 0.71875 15.7188C1.19792 15.2396 1.79167 15 2.5 15H42.5C43.2083 15 43.8021 15.2396 44.2812 15.7188C44.7604 16.1979 45 16.7917 45 17.5C45 18.2083 44.7604 18.8021 44.2812 19.2812C43.8021 19.7604 43.2083 20 42.5 20H2.5Z"
                        fill="#202020" />
                </svg>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero-section">
            <div class="banner"></div>
            <div class="hero-content">
                <div class="shop-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <defs>
                            <!-- Pixel-Schachbrett Muster -->
                            <pattern id="pixel-checkerboard" width="8" height="8" patternUnits="userSpaceOnUse">
                                <rect width="8" height="8" fill="#8BAC0F" />
                                <rect width="4" height="4" fill="#9BBC0F" />
                                <rect x="4" y="4" width="4" height="4" fill="#9BBC0F" />
                            </pattern>

                            <!-- Kreisförmige Maske -->
                            <mask id="circle-mask">
                                <circle cx="50" cy="50" r="46" fill="#FFFFFF" />
                            </mask>
                        </defs>

                        <!-- 1. Hintergrund: Schachbrett-Kreis -->
                        <circle cx="50" cy="50" r="46" fill="url(#pixel-checkerboard)" stroke="#202020"
                            stroke-width="3" />

                        <g mask="url(#circle-mask)">
                            <!-- 2. NES Konsole-->
                            <g id="nes-console" transform="translate(13, 10) scale(0.74)">
                                <rect x="10" y="25" width="80" height="50" rx="2" fill="#D8D8D8" stroke="#202020"
                                    stroke-width="3" />
                                <rect x="10" y="50" width="80" height="25" fill="#666666" />
                                <line x1="10" y1="50" x2="90" y2="50" stroke="#202020" stroke-width="2" />
                                <rect x="16" y="55" width="42" height="15" rx="1" fill="#202020" />
                                <rect x="22" y="60" width="10" height="5" rx="1" fill="#666666" />
                                <rect x="38" y="60" width="10" height="5" rx="1" fill="#666666" />
                                <rect x="65" y="58" width="8" height="8" rx="1" fill="#D8D8D8" stroke="#202020"
                                    stroke-width="1.5" />
                                <rect x="76" y="58" width="8" height="8" rx="1" fill="#D8D8D8" stroke="#202020"
                                    stroke-width="1.5" />
                                <circle cx="61" cy="62" r="1.5" fill="#E60012" />
                                <line x1="20" y1="28" x2="20" y2="50" stroke="#202020" stroke-width="2" />
                                <line x1="25" y1="28" x2="25" y2="50" stroke="#202020" stroke-width="2" />
                                <line x1="30" y1="28" x2="30" y2="50" stroke="#202020" stroke-width="2" />
                            </g>

                            <!-- 3. GameBoy -->
                            <g id="gameboy" transform="translate(32, 28) scale(0.55)">
                                <!-- Gehäuse -->
                                <rect x="22" y="8" width="56" height="84" rx="6" fill="#D8D8D8" stroke="#202020"
                                    stroke-width="3" />
                                <!-- Display-Rahmen -->
                                <rect x="28" y="16" width="44" height="32" rx="3" fill="#555555" />
                                <!-- Grüner Pixel-Bildschirm -->
                                <rect x="35" y="21" width="30" height="22" rx="1" fill="#8BAC0F" />
                                <!-- Power LED -->
                                <circle cx="31" cy="32" r="1.5" fill="#E60012" />
                                <!-- Steuerkreuz (D-Pad) -->
                                <path d="M 36 57 h -4 v 4 h -4 v 4 h 4 v 4 h 4 v -4 h 4 v -4 h -4 z" fill="#202020" />
                                <!-- A/B Buttons -->
                                <circle cx="68" cy="62" r="4" fill="#8A1B4A" />
                                <circle cx="58" cy="67" r="4" fill="#8A1B4A" />
                                <!-- Select / Start -->
                                <rect x="40" y="79" width="7" height="2.5" rx="1" transform="rotate(-25 40 79)"
                                    fill="#666666" />
                                <rect x="50" y="79" width="7" height="2.5" rx="1" transform="rotate(-25 50 79)"
                                    fill="#666666" />
                                <!-- Lautsprecher-Schlitze -->
                                <line x1="62" y1="84" x2="68" y2="78" stroke="#A0A0A0" stroke-width="2"
                                    stroke-linecap="round" />
                                <line x1="66" y1="86" x2="72" y2="80" stroke="#A0A0A0" stroke-width="2"
                                    stroke-linecap="round" />
                            </g>
                        </g>

                        <!-- Außenkontur -->
                        <circle cx="50" cy="50" r="46" fill="none" stroke="#666666" stroke-width="3" />
                    </svg>
                </div>
                <div class="headline">
                    <div class="name-and-rating">
                        <h1>Dream <span>Game</span> Hub</h1>
                        <div class="rating">
                            <svg width="23" height="22" viewBox="0 0 23 22" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M4.89113 21.5902C4.51333 21.8201 4.04501 21.4824 4.14385 21.0513L5.76226 13.9935C5.8034 13.814 5.74263 13.6265 5.60407 13.5053L0.171941 8.75452C-0.159652 8.46451 0.0186478 7.91848 0.457487 7.88006L7.62822 7.25214C7.81322 7.23594 7.974 7.11854 8.04576 6.94725L10.8279 0.306767C10.9993 -0.102286 11.5788 -0.102286 11.7502 0.306766L14.5324 6.94725C14.6041 7.11854 14.7649 7.23594 14.9499 7.25214L22.1206 7.88006C22.5595 7.91848 22.7378 8.46451 22.4062 8.75452L16.9741 13.5053C16.8355 13.6265 16.7747 13.814 16.8159 13.9935L18.4343 21.0513C18.5331 21.4824 18.0648 21.8201 17.687 21.5902L11.549 17.855C11.3893 17.7579 11.1888 17.7579 11.0291 17.855L4.89113 21.5902Z"
                                    fill="#363534" />
                            </svg>
                            <p>4,2 <span>(2187)</span></p>
                        </div>
                    </div>
                    <h3>Retro Consoles, Games, and Periphery of your Dreams</h3>
                </div>
            </div>
        </section>
        <nav class="category-navigation"></nav>
        <section id="category"></section>
    </main>
    <footer></footer>
</body>

</html>
